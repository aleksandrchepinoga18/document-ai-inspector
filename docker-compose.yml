name: document-ai-inspector

x-app: &app
  image: document-ai-inspector:stage5
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Document AI Inspector}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      YANDEX_BASE_URL: ${YANDEX_BASE_URL:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-20000}
      LLM_MAX_FRAGMENTS: ${LLM_MAX_FRAGMENTS:-200}
      LLM_MAX_RESPONSE_CHARS: ${LLM_MAX_RESPONSE_CHARS:-50000}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LIBREOFFICE_BINARY: libreoffice
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-120}
      DATA_DIR: /app/results
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-1000}
      MAX_UNCOMPRESSED_BYTES: ${MAX_UNCOMPRESSED_BYTES:-104857600}
      MAX_ZIP_RATIO: ${MAX_ZIP_RATIO:-200}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-60}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-52428800}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-300}
    volumes:
      - documents_data:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ui:
    <<: *app
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mlflow_data:
  documents_data:
